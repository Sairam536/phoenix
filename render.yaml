services:
  - type: web
    name: documind-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://frontend-beryl-ten-26.vercel.app
      - key: LOG_LEVEL
        value: info
      - key: ENABLE_DEMO_MODE
        value: "true"
      - key: SUPABASE_STORAGE_BUCKET
        value: documents
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: SUPABASE_URL
        value: https://wqfhjkfprqqcqlgmzwao.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
